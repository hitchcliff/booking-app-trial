query ReadAllBookings($options: ReadBookingInput!) {
  readAllBookings(options: $options) {
    ...Booking
    user {
      ...User
    }
    appointments {
      ...Appointment
      user {
        ...User
      }
    }
    userLikes {
      ...Like
      user {
        ...User
      }
      booking {
        ...Booking
      }
    }
  }
}
