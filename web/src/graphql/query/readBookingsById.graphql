query ReadBookingById($id: Float!) {
  readBookingById(id: $id) {
    ...Booking
    user {
      ...User
    }
    appointments {
      ...Appointment
      user {
        ...User
      }
    }
    userLikes {
      ...Like
      user {
        ...User
      }
      booking {
        ...Booking
      }
    }
  }
}
